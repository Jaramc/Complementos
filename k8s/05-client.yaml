apiVersion: apps/v1
kind: Deployment
metadata:
  name: pqrs-client
  namespace: pqrs-saas
  labels:
    app: pqrs-client
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pqrs-client
  template:
    metadata:
      labels:
        app: pqrs-client
        tier: frontend
    spec:
      containers:
        - name: client
          image: pqrs-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: pqrs-client
  namespace: pqrs-saas
  labels:
    app: pqrs-client
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: pqrs-client
