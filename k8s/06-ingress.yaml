apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pqrs-ingress
  namespace: pqrs-saas
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "pqrs-api"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,X-Tenant-Id"
spec:
  tls:
    - hosts:
        - pqrs.jaramc.dev
        - support.jaramc.dev
        - triage.jaramc.dev
      secretName: pqrs-tls-secret
  rules:
    # 1. Panel de Agentes (Dashboard React)
    - host: pqrs.jaramc.dev
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pqrs-api
                port:
                  number: 8080
          - path: /hubs
            pathType: Prefix
            backend:
              service:
                name: pqrs-api
                port:
                  number: 8080
          - path: /swagger
            pathType: Prefix
            backend:
              service:
                name: pqrs-api
                port:
                  number: 8080
          - path: /pqrs-widget.js
            pathType: Exact
            backend:
              service:
                name: pqrs-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pqrs-client
                port:
                  number: 80

    # 2. Portal Demo de Soporte y Widget CDN
    - host: support.jaramc.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pqrs-api
                port:
                  number: 8080

    # 3. Backend API REST, Swagger y Motor de Triaje / RAG
    - host: triage.jaramc.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pqrs-api
                port:
                  number: 8080

    # 4. Regla por defecto para acceso directo por IP (161.97.136.42)
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pqrs-api
                port:
                  number: 8080
          - path: /hubs
            pathType: Prefix
            backend:
              service:
                name: pqrs-api
                port:
                  number: 8080
          - path: /swagger
            pathType: Prefix
            backend:
              service:
                name: pqrs-api
                port:
                  number: 8080
          - path: /pqrs-widget.js
            pathType: Exact
            backend:
              service:
                name: pqrs-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pqrs-client
                port:
                  number: 80
