apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pqrs-frontend-ingress
  namespace: pqrs-saas
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "pqrs-api"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS, PATCH"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Authorization, X-Requested-With, X-Tenant-Id"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
spec:
  ingressClassName: nginx
  rules:
    - host: pqrs.jaramc.dev
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pqrs-api
                port:
                  number: 8080
          - path: /hubs
            pathType: Prefix
            backend:
              service:
                name: pqrs-api
                port:
                  number: 8080
          - path: /swagger
            pathType: Prefix
            backend:
              service:
                name: pqrs-api
                port:
                  number: 8080
          - path: /pqrs-widget.js
            pathType: Prefix
            backend:
              service:
                name: pqrs-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pqrs-client
                port:
                  number: 80
  tls:
    - hosts:
        - pqrs.jaramc.dev
      secretName: pqrs-tls-secret
---
